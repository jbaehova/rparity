[build-system]
requires = ["hatchling", "scipy-openblas32==0.3.34.237.0"]
build-backend = "hatchling.build"

[project]
name = "rparity"
version = "0.2.0"
description = "R-style mixed models, GAMs and estimated marginal means in Python, without an R runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "formulaic>=1.1", "statsmodels>=0.14"]

[project.urls]
Documentation = "https://jbaehova.github.io/rparity/"
Repository = "https://github.com/jbaehova/rparity"
Issues = "https://github.com/jbaehova/rparity/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "pandas-stubs", "scipy-stubs", "mkdocs-material>=9", "polars>=1", "scipy-openblas32==0.3.34.237.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "legacy"
markers = ["needs_r: development-only tests requiring R and its packages", "golden: comparisons with R oracle outputs"]

[tool.hatch.build.targets.wheel]
packages = ["src/rparity"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/rparity", "hatch_build.py", "LICENSE", "LICENSES", "pyproject.toml", "README.md"]
