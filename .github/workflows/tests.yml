name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'reports/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'reports/**']
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }} --locked
      - run: uv run pytest -m 'not needs_r'
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv build
